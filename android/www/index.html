<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل المبيعات والأقساط</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e78">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الأقساط">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ctext y='.9em' font-size='9'%3E💰%3C/text%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mu:#5f6b7a;--bd:#d9dee5;--pri:#1f4e78;--paid:#87ceeb;--paidt:#0b3c5d;--late:#ffc7ce;--latet:#9c0006;--soon:#fff2cc;--ok:#c6efce;--okt:#006100}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171d;--card:#1b222b;--tx:#e8edf3;--mu:#9aa6b4;--bd:#2d3744;--pri:#4a8bc2;--soon:#5c4a12;--late:#6b2230;--latet:#ffd0d6;--ok:#1f4d2b;--okt:#bdf0c9;--paid:#2a6f95;--paidt:#e3f4ff}}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
.wrap{max-width:1250px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:14px 0 6px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-bottom:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.box small{color:var(--mu);display:block;font-size:12px}.box b{font-size:17px}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
input,button,select{font:inherit;color:inherit}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0;width:100%}
.bar input{flex:1;min-width:150px;width:auto}.bar select{width:auto}
button,.btn{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}button.d{color:var(--latet)}
button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cust{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.nm{font-weight:700;color:var(--pri);cursor:pointer;background:none;border:0;padding:0;font-size:15px;text-align:start}
.chip{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.متأخر{background:var(--late);color:var(--latet)}.chip.منتظم{background:var(--ok);color:var(--okt)}.chip.مكتمل{background:var(--paid);color:var(--paidt)}
.sq{display:flex;flex-wrap:wrap;gap:3px}
.sq button{width:24px;height:24px;padding:0;border:0;border-radius:4px;font-size:11px;font-weight:700}
.sq .paid{background:var(--paid);color:var(--paidt)}.sq .late{background:var(--late)}.sq .soon{background:var(--soon)}
.ft{display:flex;gap:14px;font-size:13px;color:var(--mu);flex-wrap:wrap;margin-top:8px}.ft b{color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:10px 0}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:center;font-size:13px}
th{background:var(--pri);color:#fff;position:sticky;top:0;white-space:nowrap}
td.l{text-align:start}tr.late td{background:var(--late)}td.paid{background:var(--paid);color:var(--paidt);font-weight:700}
.t td .sq{min-width:150px;max-width:340px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(420px,94vw)}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.lg{font-size:12px;color:var(--mu);display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-inline-end:4px}
.pg{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.pg i{display:block;height:100%;background:var(--paid)}
.today{background:var(--card);border:1px solid var(--bd);border-right:4px solid var(--latet);border-radius:10px;padding:10px;margin-bottom:12px}
.tr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.tr:first-of-type{border-top:0}.tr a{padding:4px 10px;font-size:13px;color:var(--pri)}
.note{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--bd);font-size:13px}
.mb{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;min-width:100px}.mb i{display:block;height:100%;background:var(--paid)}
details.mo{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;padding:8px}
details.mo summary{cursor:pointer;display:flex;gap:14px;flex-wrap:wrap;align-items:center}details.cur{border-right:4px solid var(--pri)}

.hero{background:var(--pri);color:#fff;border-radius:14px;padding:16px;text-align:center;margin-bottom:10px}
.hero small{opacity:.85;font-size:13px}.hero b{font-size:34px;display:block;margin:2px 0}
.hero .pg{background:rgba(255,255,255,.3);margin:8px 0}.hero .pg i{background:#fff}
.sum.two{grid-template-columns:1fr 1fr}
details.sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}
details.sec>summary{cursor:pointer;padding:12px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:before{content:'◂';transition:transform .15s;color:var(--mu)}details.sec[open]>summary:before{transform:rotate(-90deg)}
details.sec .bd{margin-inline-start:auto;font-size:12px;font-weight:400;color:var(--mu)}
details.sec>.sb{padding:0 12px 12px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg">
<h2>عميل جديد</h2>
<div class="grid" style="grid-template-columns:1fr 1fr">
<div style="grid-column:1/3"><label>اسم العميل</label><input id="f_name"></div>
<div><label>تاريخ البيع</label><input id="f_date" type="date"></div>
<div><label>المبلغ الأصلي</label><input id="f_amount" type="number" inputmode="decimal"></div>
<div><label>عدد الأقساط</label><input id="f_n" type="number" min="1" max="120" inputmode="numeric"></div>
<div><label>رقم الهاتف</label><input id="f_phone" inputmode="tel"></div>
<div><label>المنتج</label><input id="f_product"></div>
<div><label>العنوان</label><input id="f_addr"></div>
</div>
<div class="bar" style="margin:0"><button class="p" id="f_ok">حفظ</button><button id="f_no">إلغاء</button></div>
</dialog>
<dialog id="dlg3"><h2>معاينة الرفع</h2><div id="imp_body"></div><div class="bar" style="margin:10px 0 0"><button class="p" id="imp_ok">تأكيد الاستيراد</button><button id="imp_no">إلغاء</button></div></dialog>
<dialog id="dlg4"><div id="ask_m" style="margin-bottom:12px"></div><div class="bar" style="margin:0"><button class="p" id="ask_y">نعم</button><button id="ask_n">لا</button></div></dialog>
<div id="toast"></div>
<dialog id="dlg2"><h2>حركة كاش</h2>
<div class="grid" style="grid-template-columns:1fr 1fr"><div><label>النوع</label><select id="x_type"><option value="in">دخل +</option><option value="out">خروج −</option></select></div>
<div><label>المبلغ</label><input id="x_amt" type="number" inputmode="decimal"></div>
<div><label>التاريخ</label><input id="x_date" type="date"></div>
<div style="grid-column:1/3"><label>ملاحظة</label><input id="x_note"></div></div>
<div class="bar" style="margin:0"><button class="p" id="x_ok">حفظ</button><button id="x_no">إلغاء</button></div></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let L=[],cur=null,q='',flt='all',srt='name',tab='list',pw='week',store=null,wide=innerWidth>=760;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=d=>d?d.split('-').reverse().join('/'):'';
const rd=n=>Math.round(n*100)/100;
const fm=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function addM(d,k){const[y,m,x]=d.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+k,1));
 const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(x,last));return t.toISOString().slice(0,10)}
function amt(c,i){const b=rd(c.amount/c.n);return i===c.n?rd(c.amount-b*(c.n-1)):b}
function calc(c){let paid=0,late=0,cnt=0,lateAmt=0,first=null,firstAmt=0,oldest=null;const t=today();
 for(let i=1;i<=c.n;i++){const due=addM(c.date,i),a=amt(c,i);
  if(c.paid&&c.paid[i]){paid+=a;cnt++}else{if(!first){first=due;firstAmt=a}if(due<t){late++;lateAmt+=a;oldest=oldest||due}}}
 const rem=rd(c.amount-paid),lateDays=oldest?dd(t,oldest):0,left=first?dd(first,t):999;
 return{paid:rd(paid),rem,late,cnt,lateAmt:rd(lateAmt),first,firstAmt,lateDays,left,st:rem<=0?'مكتمل':late?'متأخر':'منتظم'}}
function persist(c,del){
 if(store){const r=store.doc(c.id);(del?r.delete():r.set(c)).catch(()=>{})}
 else try{localStorage.setItem('inst',JSON.stringify(L))}catch(e){}}
function save(c){const i=L.findIndex(x=>x.id===c.id);i<0?L.push(c):L[i]=c;persist(c);render()}
function remove(c){L=L.filter(x=>x.id!==c.id);persist(c,true);cur=null;render()}
function setPaid(c,i,d){c.paid=c.paid||{};d?c.paid[i]=d:delete c.paid[i];save(c)}
const wa=p=>{p=String(p||'').replace(/\D/g,'');return p.startsWith('0')?'20'+p.slice(1):p};

function sqs(c){let h='';for(let i=1;i<=c.n;i++){const due=addM(c.date,i),p=c.paid&&c.paid[i];
 h+=`<button class="${p?'paid':due<today()?'late':'soon'}" data-sq="${c.id}|${i}" title="${i} - ${fd(due)}">${p?'✔':''}</button>`}return h}

function dash(all){const t=today();let s=0,p=0,la=0,ln=0,mo=0;const ym=t.slice(0,7);
 all.forEach(({c,k})=>{s+=c.amount;p+=k.paid;la+=k.lateAmt;ln+=k.late;
  for(let i=1;i<=c.n;i++)if(!(c.paid&&c.paid[i])&&addM(c.date,i).slice(0,7)===ym)mo+=amt(c,i)});
 const pc=s?p/s*100:0;
 return`<div class="hero"><small>لسه (المتبقي)</small><b>${fm(rd(s-p))}</b><div class="pg"><i style="width:${pc}%"></i></div><small>تم تحصيل ${pc.toFixed(1)}% من إجمالي المبلغ</small></div>
 <div class="sum two"><div class="box"><small>💵 الكاش معايا</small><b>${fm(bal())}</b><div class="bar" style="margin:6px 0 0"><button class="p" data-tx="in">+ دخل</button><button data-tx="out">− خروج</button></div></div>
 <div class="box"><small>إجمالي المبلغ</small><b>${fm(rd(s))}</b><small>${all.length} عميل</small></div></div>
 <div class="sum"><div class="box"><small>المحصّل من الأقساط</small><b>${fm(rd(p))}</b></div><div class="box"><small>المتأخر</small><b style="color:var(--latet)">${fm(rd(la))}</b><small>${ln} قسط</small></div>
 <div class="box"><small>مستحق هذا الشهر</small><b>${fm(rd(mo))}</b></div></div>`}

function listView(){
 let all=L.map(c=>({c,k:calc(c)}));const d=dash(all);
 let rows=all.filter(({c,k})=>(!q||(c.name+c.phone+c.product).includes(q))&&(flt==='all'||(flt==='late'&&k.late>0)||(flt==='week'&&k.rem>0&&k.left<=7&&!k.late)||(flt==='done'&&k.rem<=0)));
 rows.sort((a,b)=>srt==='rem'?b.k.rem-a.k.rem:srt==='late'?b.k.lateDays-a.k.lateDays:a.c.name.localeCompare(b.c.name,'ar'));
 const body=!rows.length?`<div class="empty">${L.length?'لا نتائج':'لا يوجد عملاء بعد.<br><br><button class="p" id="add2">+ أضف أول عميل</button> <button id="demo">إضافة بيانات تجريبية</button>'}</div>`
 :wide?`<div class="tw"><table class="t"><tr><th>العميل</th><th>المنتج</th><th>الهاتف</th><th>المبلغ الأصلي</th><th>القسط الشهري</th><th>المدفوع</th><th>المتبقي</th><th>القادم</th><th>الحالة</th><th>الأقساط</th></tr>
 ${rows.map(({c,k})=>`<tr><td class="l"><button class="nm" data-open="${c.id}">${esc(c.name)}</button></td><td>${esc(c.product)}</td><td>${esc(c.phone)}</td><td>${fm(c.amount)}</td><td><b>${fm(amt(c,1))}</b></td><td>${fm(k.paid)}</td><td><b>${fm(k.rem)}</b></td>
 <td>${k.rem>0&&k.first?fd(k.first):'—'}</td><td><span class="chip ${k.st}">${k.st}</span></td><td><div class="sq">${sqs(c)}</div></td></tr>`).join('')}</table></div>`
 :rows.map(({c,k})=>`<div class="cust"><div class="hd"><button class="nm" data-open="${c.id}">${esc(c.name)} ◂</button><span class="chip ${k.st}">${k.st}</span></div>
 <div class="sq">${sqs(c)}</div><div class="ft"><span>القسط الشهري: <b>${fm(amt(c,1))}</b></span><span>المتبقي: <b>${fm(k.rem)}</b></span><span>المدفوع: <b>${fm(k.paid)}</b></span><span>الأقساط: <b>${k.cnt}/${c.n}</b></span>${k.late?`<span>متأخر: <b>${k.late}</b></span>`:''}${k.rem>0&&k.first?`<span>القادم: <b>${fd(k.first)}</b></span>`:''}</div></div>`).join('');
 const fb=(v,t)=>`<button data-flt="${v}" class="${flt===v?'on':''}">${t}</button>`;
 const cust=`<div class="bar"><input id="q" placeholder="بحث بالاسم أو الهاتف أو المنتج" value="${esc(q)}"><button class="p" id="add">+ عميل جديد</button></div>
 <div class="bar">${fb('all','الكل')}${fb('late','متأخرين')}${fb('week','قسط خلال أسبوع')}${fb('done','مكتمل')}
 <select id="srt"><option value="name"${srt==='name'?' selected':''}>ترتيب: الاسم</option><option value="rem"${srt==='rem'?' selected':''}>الأكبر متبقي</option><option value="late"${srt==='late'?' selected':''}>الأقدم تأخيرًا</option></select></div>
 <div class="lg"><span><i style="background:var(--paid)"></i>مدفوع</span><span><i style="background:var(--late)"></i>متأخر</span><span><i style="background:var(--soon)"></i>لم يحن موعده</span><span>اضغط المربع لتسجيل السداد</span></div>`+body;
 const tools=`<div class="bar"><button id="imp">⬆ رفع إكسيل</button><button id="tpl">قالب الرفع</button></div>
 <div class="bar"><button id="expx" class="p">⬇ تصدير إكسيل (كل البيانات)</button></div>
 <div class="bar"><button id="bk">💾 نسخة احتياطية</button><button id="rs">استعادة</button></div>
 <input id="impf" type="file" accept=".xlsx,.xls,.csv" hidden><input id="rsf" type="file" accept=".json" hidden>`;
 return d+sec('cash','💵 دفتر الكاش',cashView(),'الرصيد '+fm(bal()))+sec('due','💳 المطلوب سداده',dueBox(all))+sec('cust','👥 العملاء',cust,rows.length+' / '+all.length)+sec('tools','🧰 أدوات وبيانات',tools)}

function reportView(){const m={};
 L.forEach(c=>{for(let i=1;i<=c.n;i++){const k=addM(c.date,i).slice(0,7);(m[k]=m[k]||{d:0,c:0}).d+=amt(c,i);
  const p=c.paid&&c.paid[i];if(p){const pk=p.slice(0,7);(m[pk]=m[pk]||{d:0,c:0}).c+=amt(c,i)}}});
 const ks=Object.keys(m).sort(),mx=Math.max(1,...ks.map(k=>Math.max(m[k].d,m[k].c)));
 return`<h2>التقرير الشهري</h2><div class="lg">المستحق = أقساط موعدها في الشهر · المحصّل = أقساط اتسددت فيه</div>
 ${ks.length?`<div class="tw"><table><tr><th>الشهر</th><th>المستحق</th><th>المحصّل</th><th>الفرق</th><th></th></tr>${ks.map(k=>`<tr><td>${k.split('-').reverse().join('/')}</td><td>${fm(rd(m[k].d))}</td><td>${fm(rd(m[k].c))}</td><td>${fm(rd(m[k].d-m[k].c))}</td><td><div class="mb"><i style="width:${m[k].c/mx*100}%"></i></div></td></tr>`).join('')}</table></div>`:'<div class="empty">لا بيانات</div>'}`}

function detailView(c){const k=calc(c),pc=Math.min(100,c.paid&&k.paid?k.paid/c.amount*100:0);
 let tr='';for(let i=1;i<=c.n;i++){const due=addM(c.date,i),p=c.paid&&c.paid[i],lt=!p&&due<today();
  tr+=`<tr class="${lt?'late':''}"><td>${i}</td><td>${fd(due)}</td><td>${fm(amt(c,i))}</td><td class="${p?'paid':''}">${p?'مدفوع':'غير مدفوع'}</td>
  <td>${p?`<input type="date" value="${p}" data-pd="${i}" style="width:140px">`:`<button data-pay="${i}">تسجيل سداد</button>`}</td><td>${p?Math.max(0,dd(p,due)):lt?dd(today(),due)+' (متأخر)':''}</td></tr>`}
 const ns=(c.notes||[]).slice().reverse().map((n,j)=>`<div class="note"><span>${fd(n.d)} — ${esc(n.t)}</span><button class="d" data-dn="${(c.notes.length-1-j)}">✕</button></div>`).join('');
 return`<div class="bar"><button id="back">▶ رجوع</button>${c.phone?`<a class="btn" href="tel:${esc(c.phone)}" target="_blank" rel="noopener">اتصال</a><a class="btn" href="https://wa.me/${wa(c.phone)}" target="_blank" rel="noopener">واتساب</a>`:''}<button class="d" id="del" style="margin-inline-start:auto">حذف العميل</button></div>
 <div class="hd"><h1 style="margin:0">${esc(c.name)}</h1><span class="chip ${k.st}">${k.st}</span></div>
 <div class="pg"><i style="width:${pc}%"></i></div><div class="ft"><span>تم سداد <b>${pc.toFixed(0)}%</b> — ${k.cnt} من ${c.n} قسط</span></div>
 <div class="sum" style="margin-top:10px"><div class="box"><small>المبلغ الأصلي</small><b>${fm(c.amount)}</b></div><div class="box"><small>قيمة القسط</small><b>${fm(amt(c,1))}</b></div>
 <div class="box"><small>المدفوع</small><b>${fm(k.paid)}</b></div><div class="box"><small>المتبقي</small><b>${fm(k.rem)}</b></div>
 <div class="box"><small>المتأخر</small><b style="color:var(--latet)">${fm(k.lateAmt)}</b><small>${k.late} قسط</small></div></div>
 <div class="grid"><div><label>اسم العميل</label><input data-f="name" value="${esc(c.name)}"></div><div><label>تاريخ البيع</label><input data-f="date" type="date" value="${c.date}"></div><div><label>المبلغ الأصلي</label><input data-f="amount" type="number" inputmode="decimal" value="${c.amount}"></div><div><label>عدد الأقساط</label><input data-f="n" type="number" min="1" max="120" inputmode="numeric" value="${c.n}"></div>

async function exportCsv(kind){
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 let h,rows=[];const t=today();
 if(kind==='inst'){h=['العميل','الهاتف','المنتج','رقم القسط','تاريخ الاستحقاق','القيمة','الحالة','تاريخ السداد','أيام التأخير'];
  L.forEach(c=>{for(let i=1;i<=c.n;i++){const due=addM(c.date,i),p=c.paid&&c.paid[i];
   rows.push([c.name,c.phone,c.product,i,fd(due),amt(c,i),p?'مدفوع':due<t?'متأخر':'لم يحن',p?fd(p):'',p?Math.max(0,dd(p,due)):due<t?dd(t,due):''].map(q).join(','))}})}
 else{h=['الاسم','المنتج','الهاتف','العنوان','تاريخ البيع','المبلغ','قيمة القسط','عدد الأقساط','أقساط مدفوعة','أقساط متبقية','المدفوع','المتبقي','نسبة السداد %','أقساط متأخرة','مبلغ متأخر','أيام التأخير','القسط القادم','قيمة القسط القادم','الحالة','آخر ملاحظة'];
  rows=L.map(c=>{const k=calc(c),nt=(c.notes||[]).slice(-1)[0];return[c.name,c.product,c.phone,c.addr,fd(c.date),c.amount,amt(c,1),c.n,k.cnt,c.n-k.cnt,k.paid,k.rem,rd(k.paid/c.amount*100),k.late,k.lateAmt,k.lateDays,k.rem>0?fd(k.first):'',k.rem>0?k.firstAmt:'',k.st,nt?fd(nt.d)+' - '+nt.t:''].map(q).join(',')})}
 const data='\ufeff'+[h.map(q).join(','),...rows].join('\n');
 try{const d=await claude.use('downloads');if(d){await d.save({filename:kind==='inst'?'installments.csv':'customers.csv',data});return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=kind==='inst'?'installments.csv':'customers.csv';a.click()}

const bal=()=>rd((+CASH.v||0)+TX.reduce((a,x)=>a+(x.type==='in'?x.amt:-x.amt),0));
function persistTx(x,del){if(store){const r=store.doc(x.id);(del?r.delete():r.set({...x,_tx:1})).catch(()=>{})}else try{localStorage.setItem('inst_tx',JSON.stringify(TX))}catch(e){}}
function saveTx(x){const i=TX.findIndex(y=>y.id===x.id);i<0?TX.push(x):TX[i]=x;persistTx(x);render()}
function delTx(x){TX=TX.filter(y=>y.id!==x.id);persistTx(x,true);render()}

migrate();

 L.forEach(c=>{for(let i=1;i<=c.n;i++){if(c.paid&&c.paid[i])continue;const due=addM(c.date,i),a=amt(c,i),k=due<t?'0':due.slice(0,7);
  (m[k]=m[k]||{s:0,r:[]}).s+=a;m[k].r.push({c,i,due,a});tot+=a;cnt++}});
 const ks=Object.keys(m).sort();let cum=0;
 return`<h2>الشهور القادمة والمستحق</h2>
 <div class="sum"><div class="box"><small>إجمالي المستحق كله</small><b>${fm(rd(tot))}</b></div>
 <div class="box"><small>منه متأخر</small><b style="color:var(--latet)">${fm(rd(m['0']?m['0'].s:0))}</b></div>
 <div class="box"><small>عدد الأقساط المتبقية</small><b>${cnt}</b></div></div>
 ${ks.length?ks.map(k=>{const x=m[k];cum+=x.s;x.r.sort((a,b)=>a.due.localeCompare(b.due));
  const lb=k==='0'?'متأخر حتى اليوم':MN[+k.slice(5)-1]+' '+k.slice(0,4);
  return`<details class="mo${k===ym?' cur':''}"${k==='0'||k===ym?' open':''}><summary><b>${lb}</b><span>${x.r.length} قسط</span><b style="color:${k==='0'?'var(--latet)':'inherit'}">${fm(rd(x.s))}</b><span style="color:var(--mu)">تراكمي ${fm(rd(cum))}</span></summary>
  <div class="tw" style="margin-top:8px"><table><tr><th>العميل</th><th>القسط</th><th>الاستحقاق</th><th>القيمة</th></tr>${x.r.map(r=>`<tr><td class="l"><button class="nm" data-open="${r.c.id}">${esc(r.c.name)}</button></td><td>${r.i}/${r.c.n}</td><td>${fd(r.due)}</td><td>${fm(r.a)}</td></tr>`).join('')}</table></div></details>`}).join(''):'<div class="empty">لا أقساط مستحقة 🎉</div>'}`}

const COLS={name:['الاسم','العميل','اسم العميل'],date:['تاريخ البيع','التاريخ'],amount:['المبلغ الأصلي','المبلغ الاصلي','المبلغ'],n:['عدد الأقساط','الأقساط'],phone:['الهاتف','التليفون','الموبايل','رقم الهاتف'],product:['المنتج'],addr:['العنوان'],paid:['أقساط مدفوعة','الأقساط المدفوعة'],last:['تاريخ آخر سداد','تاريخ السداد']};
const num=v=>parseFloat(String(v).replace(/[,٬\s]/g,''))||0;
const p2=x=>String(x).padStart(2,'0');
function toDate(v){if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+432e5);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
 if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
 const s=String(v||'').trim();let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
 m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);return m?m[3]+'-'+p2(m[2])+'-'+p2(m[1]):''}
let ASK=null;
function ask(m){return new Promise(r=>{ASK=r;$('#ask_m').textContent=m;$('#dlg4').showModal()})}
function toast(m){const e=$('#toast');e.textContent=m;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>{e.className=''},3800)}
$('#dlg4').addEventListener('close',()=>{if(ASK){const r=ASK;ASK=null;r(false)}});
let PEND=null;
const nph=p=>String(p||'').replace(/\D/g,'').replace(/^20/,'0');
async function importFile(f){if(!f)return;if(!window.XLSX){toast('تعذر تحميل مكتبة الإكسيل، تأكد من الإنترنت');return}
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const pick=(r,k)=>{for(const h of COLS[k])for(const key in r)if(key.trim()===h)return r[key];return''};
  const items=[],errs=[];
  rows.forEach((r,ix)=>{const row=ix+2,name=String(pick(r,'name')).trim(),dv=pick(r,'date'),date=toDate(dv),amount=num(pick(r,'amount')),n=Math.round(num(pick(r,'n')));
   if(!name&&!String(dv).trim()&&!amount&&!n)return;
   const why=!name?'الاسم ناقص':!date?'تاريخ البيع ناقص أو غير مفهوم':!(amount>0)?'المبلغ الأصلي ناقص':!(n>=1&&n<=120)?'عدد الأقساط ناقص أو غير صحيح':'';
   if(why){errs.push('الصف '+row+': '+why+(name?' ('+name+')':''));return}
   const ph=String(pick(r,'phone')||'').trim();
   let prevNew=null;const di=items.findIndex(x=>x.c.date===date&&x.c.name===name);if(di>=0){prevNew=items[di].isNew;items.splice(di,1)}
   const base=L.find(x=>x.date===date&&(x.name===name||(ph&&nph(x.phone)===nph(ph))));
   const c=base?JSON.parse(JSON.stringify(base)):{id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),paid:{},notes:[]};
   Object.assign(c,{name,date,amount,n,phone:ph||c.phone||'',product:String(pick(r,'product')||c.product||''),addr:String(pick(r,'addr')||c.addr||'')});
   const pd=pick(r,'paid');
   if(pd!==''){const k=Math.max(0,Math.min(n,Math.round(num(pd))));c.paid={};for(let i=1;i<=k;i++)c.paid[i]=addM(date,i);const ld=toDate(pick(r,'last'));if(k>0&&ld)c.paid[k]=ld}
   items.push({c,isNew:prevNew!==null?prevNew:!base,k:Object.keys(c.paid||{}).length})});
  if(!items.length&&!errs.length){toast('الملف فاضي. الأعمدة المطلوبة: الاسم، تاريخ البيع، المبلغ الأصلي، عدد الأقساط');return}
  PEND=items;const nn=items.filter(x=>x.isNew).length;
  $('#imp_body').innerHTML=`<div class="ft" style="margin:0 0 8px"><span>جديد: <b>${nn}</b></span><span>تحديث: <b>${items.length-nn}</b></span><span>مرفوض: <b style="color:var(--latet)">${errs.length}</b></span></div>
  ${items.length?`<div class="tw" style="max-height:220px;overflow:auto"><table><tr><th>العميل</th><th>المبلغ</th><th>الأقساط</th><th>مدفوع</th><th></th></tr>${items.slice(0,30).map(x=>`<tr><td class="l">${esc(x.c.name)}</td><td>${fm(x.c.amount)}</td><td>${x.c.n}</td><td>${x.k}</td><td>${x.isNew?'جديد':'تحديث'}</td></tr>`).join('')}</table></div>${items.length>30?`<div class="ft">… و${items.length-30} آخرين</div>`:''}`:''}
  ${errs.length?`<h2 style="color:var(--latet)">صفوف مرفوضة (لن تُستورد)</h2><div style="max-height:140px;overflow:auto;font-size:13px">${errs.slice(0,40).map(e=>`<div>${esc(e)}</div>`).join('')}${errs.length>40?'<div>…</div>':''}</div>`:''}`;
  $('#imp_ok').disabled=!items.length;$('#dlg3').showModal()}
 catch(e){toast('تعذر قراءة الملف')}}
async function saveBin(fn,data,type){
 try{const d=await claude.use('downloads');if(d){await d.save({filename:fn,data});return true}}catch(e){if(e&&e.code==='declined')return true;if(e&&/extension/.test(e.code||''))return false}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=fn;a.click();return true}catch(e){return false}}
async function template(){const h=['الاسم','المنتج','الهاتف','العنوان','تاريخ البيع','المبلغ الأصلي','عدد الأقساط','أقساط مدفوعة','تاريخ آخر سداد'];
 const ex=['أحمد محمد','ثلاجة','01012345678','القاهرة','2026-01-10',12000,5,1,''];
 if(window.XLSX){try{const ws=XLSX.utils.aoa_to_sheet([h,ex]);ws['!cols']=h.map(()=>({wch:18}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'العملاء');
  if(await saveBin('template.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'))return}catch(e){}}
 await saveBin('template.csv','\ufeff'+h.join(',')+'\n'+ex.join(',')+'\n','text/csv')}

 try{const d=await claude.use('downloads');if(d){await d.save({filename:fn,data});return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;a.click()}
async function restore(f){if(!f)return;try{const raw=JSON.parse(await f.text()),a=Array.isArray(raw)?raw:raw.customers,xs=Array.isArray(raw)?[]:(raw.tx||[]);
 if(!Array.isArray(a)||!a.every(c=>c&&c.id&&c.name&&c.date&&c.amount>0&&c.n>=1))throw 0;
 if(!(await ask('استعادة '+a.length+' عميل؟ العملاء بنفس الرقم هيتحدثوا والباقي بيفضل زي ما هو.')))return;
 a.forEach(c=>{const i=L.findIndex(x=>x.id===c.id);i<0?L.push(c):L[i]=c;persist(c)});xs.forEach(x=>{if(x&&x.id&&x.amt>0){const i=TX.findIndex(y=>y.id===x.id);i<0?TX.push(x):TX[i]=x;persistTx(x)}});render()}catch(e){toast('الملف غير صالح')}}
